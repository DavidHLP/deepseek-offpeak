name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 26.7.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -not -path './.serena/*' -print0 |
            xargs -0 -r -n1 node --check
      - name: Validate manifest
        run: node scripts/ci/validate-manifest.js
      - name: Run self-checks
        run: |
          node tests/schedule.test.js
          node tests/balance.test.js
          node tests/status.test.js
      - name: Check CLI help is offline-safe
        run: |
          set -euo pipefail
          env -u DEEPSEEK_API_KEY timeout 5s ./bin/deepseek-offpeak --help

  qml:
    name: QML validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run QML import/parser smoke check
        run: scripts/ci/validate-qml.sh

  package:
    name: Runtime package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Package, extract, and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/deepseek-offpeak.tar"
          checksums="$RUNNER_TEMP/SHA256SUMS"
          extracted="$RUNNER_TEMP/deepseek-offpeak-extracted"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "$archive" \
            assets BarWidget.qml Panel.qml Service.qml \
            bin lib manifest.json README.md LICENSE \
            scripts/ci/validate-manifest.js
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$archive")" > "$checksums"
            sha256sum -c "$(basename "$checksums")"
          )
          mkdir "$extracted"
          tar -xf "$archive" -C "$extracted"
          find "$extracted" -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check
          node "$extracted/scripts/ci/validate-manifest.js"
          test -x "$extracted/bin/deepseek-offpeak"
          env -u DEEPSEEK_API_KEY timeout 5s "$extracted/bin/deepseek-offpeak" --help >/dev/null
      - name: Upload runtime package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-offpeak-${{ github.sha }}
          path: |
            ${{ runner.temp }}/deepseek-offpeak.tar
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error

  ci-ok:
    name: ci-ok
    if: always()
    needs: [node, qml, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to pass
        shell: bash
        run: |
          if [[ "${{ needs.node.result }}" != success ||
                "${{ needs.qml.result }}" != success ||
                "${{ needs.package.result }}" != success ]]; then
            echo 'A required CI job failed or was cancelled.' >&2
            exit 1
          fi
